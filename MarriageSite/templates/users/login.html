{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow mt-5">
            <div class="card-header bg-success text-white text-center">
                <h4>Login to Bureau</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100">Login</button>
                </form>
                <div class="mt-3 text-center">
                    <small>Need an account? <a href="{% url 'register' %}">Sign Up Now</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
