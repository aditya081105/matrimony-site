# Rate limiting zones to prevent Layer-7 DDoS, credential stuffing, and bot scrapers
limit_req_zone $binary_remote_addr zone=pm_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=pm_auth:10m rate=5r/s;
limit_req_status 429;

server {
    server_name poorvanchalmatrimony.social www.poorvanchalmatrimony.social;

    client_max_body_size 25M;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self';" always;

    # Block access to hidden files (.env, .git, .aws, etc.) while allowing ACME challenges
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block common exploit probes
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static assets served directly with long-lived cache headers
    location /static/ {
        alias /var/www/poorvanchalmatrimony/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Media uploads (hardened against malicious script execution and XSS)
    location /media/ {
        alias /var/www/poorvanchalmatrimony/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;

        # Strictly block access to any executable, script, or browser-executable document in media
        location ~* \.(php|pl|py|cgi|sh|bash|exe|bin|bat|cmd|msi|dll|jar|war|html|htm|xhtml|shtml|svg|js)$ {
            deny all;
            return 404;
        }
    }

    # Strict rate-limiting on sensitive authentication, contact & OTP endpoints (5 req/sec with burst 10)
    location ~* ^/(login|register|forgot-password|contact|secure-admin-panel)/ {
        limit_req zone=pm_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # General proxying with rate limiting (30 req/sec with burst 40)
    location / {
        limit_req zone=pm_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    listen 80;
}
