server {
    server_name poorvanchalmatrimony.social www.poorvanchalmatrimony.social;

    client_max_body_size 25M;

    # Static assets served directly with long-lived cache headers
    location /static/ {
        alias /var/www/poorvanchalmatrimony/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Media uploads (when local file storage is used)
    location /media/ {
        alias /var/www/poorvanchalmatrimony/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Proxy dynamic requests to Gunicorn on dedicated internal port 8001
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    listen 80;
}
