{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
<div class="col-md-6">

<div class="card shadow p-4 text-center">

    <h4 class="text-danger mb-3">Delete Account</h4>

    <p class="text-muted">
        This action is permanent. Your profile and matches will be removed.
    </p>

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3 text-start">
            <label for="password" class="form-label small fw-semibold text-secondary">Enter your current password to confirm</label>
            <input type="password" name="password" id="password" class="form-control" required placeholder="Current Password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-danger px-4">
            Confirm Delete Account
        </button>
    </form>

    <a href="{% url 'profile_list' %}"
        class="btn btn-outline-secondary mt-3">
        Cancel
    </a>

</div>

</div>
</div>

{% endblock %}
