{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
<div class="col-md-6">

<div class="card shadow p-4 text-center">

    <h4 class="text-danger mb-3">Delete Account</h4>

    <p class="text-muted">
        This action is permanent. Your profile and matches will be removed.
    </p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4">
            Confirm Delete
        </button>
    </form>

    <a href="{{ request.META.HTTP_REFERER|default:'/' }}"
        class="btn btn-outline-secondary mt-3">
        Cancel
    </a>

</div>

</div>
</div>

{% endblock %}
