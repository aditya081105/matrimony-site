{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="text-center position-relative mb-5">

    <!-- Image -->
    <img src="{% static 'images/marr.jpg' %}" 
         class="img-fluid w-100 rounded shadow"
         style="max-height:500px; object-fit:cover;">

    <!-- Centered Text -->
    <div class="position-absolute top-50 start-50 translate-middle text-center w-100">
        <h2 class="fw-bold" style="color:#444;">
            Where Families Meet and Futures Begin.
        </h2>
    </div>

</div>

{% if user.is_authenticated %}

<div class="text-center mb-5">
    <h4 class="fw-semibold mb-3">Ready to explore matches?</h4>

    <a href="{% url 'profile_list' %}" 
       class="btn btn-dark rounded-pill px-5 py-2">
        View Matchmaking Profiles
    </a>
</div>

{% else %}

<div class="text-center mb-5">
    <p class="text-muted">
        Login to explore verified matchmaking profiles.
    </p>
</div>

{% endif %}

{% endblock %}
