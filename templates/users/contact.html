{% extends "base.html" %}

{% block content %}

<div class="container mt-5" style="max-width:600px;">

<h3 class="mb-4 text-center">Contact Us</h3>

{% if success %}
<div class="alert alert-success text-center">
Your message has been sent successfully.
</div>
{% endif %}

<form method="POST">
{% csrf_token %}

<!-- Anti-spam Honeypot Fields (invisible to genuine users, traps automated crawlers) -->
<div style="display:none;" aria-hidden="true">
    <label for="website_hp">Leave this field blank</label>
    <input type="text" id="website_hp" name="website_hp" tabindex="-1" autocomplete="off">
</div>
<div style="position:absolute; left:-9999px; top:-9999px; opacity:0; width:0; height:0; z-index:-1;" aria-hidden="true">
    <label for="contact_phone_hp">Phone Number</label>
    <input type="text" id="contact_phone_hp" name="contact_phone_hp" tabindex="-1" autocomplete="off">
</div>
{% if form_time %}
<input type="hidden" name="form_time" value="{{ form_time }}">
{% endif %}

<div class="mb-3">
<label class="form-label">Your Name</label>
<input type="text" name="name" class="form-control" maxlength="100" value="{{ name|default:'' }}" required>
</div>

<div class="mb-3">
<label class="form-label">Your Email</label>
<input type="email" name="email" class="form-control" maxlength="100" value="{{ email|default:'' }}" required>
</div>

<div class="mb-3">
<label class="form-label">Message</label>
<textarea name="message" rows="4" class="form-control" maxlength="1000" required>{{ message|default:'' }}</textarea>
</div>

<button type="submit" class="btn btn-dark w-100">
Send Message
</button>

</form>

</div>

{% endblock %}
