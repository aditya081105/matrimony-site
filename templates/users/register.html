{% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height:80vh;">

<div class="card shadow-sm border-0 rounded-4 p-4" style="width:100%; max-width:420px;">

<div class="text-center mb-4">
<h3 class="fw-bold">Create Profile</h3>
<p class="text-muted small">
Join Siwan Matrimony
</p>
</div>

<form method="POST">
{% csrf_token %}

{% for field in form %}

<div class="mb-3">

<label class="form-label">
    {% if field.name == "password1" %}
        Enter Password
    {% elif field.name == "password2" %}
        Retype Password
    {% else %}
        {{ field.label }}
    {% endif %}
</label>

{{ field }}

{% if field.errors %}
<div class="text-danger small">
{{ field.errors|striptags }}
</div>
{% endif %}

</div>

{% endfor %}
<button type="submit"
class="btn btn-dark w-100 rounded-pill mt-2">
Create Profile
</button>

</form>

<div class="text-center mt-3">

<small>
Already registered?
<a href="{% url 'login' %}">
Login
</a>
</small>

</div>

</div>
</div>

{% endblock %}
