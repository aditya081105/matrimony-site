{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="d-flex flex-column min-vh-100">
<div class="d-md-none mb-3 text-end">
    <button class="btn btn-dark rounded-pill"
            data-bs-toggle="collapse"
            data-bs-target="#filterPanel">
        Filters
    </button>
</div>

<div class="collapse d-md-block" id="filterPanel">

<form method="GET"
      action="{% url 'profile_list' %}"
      hx-get="{% url 'profile_list' %}"
      hx-target="#profiles-grid-container"
      hx-indicator="#filter-indicator"
      hx-push-url="true"
      class="card shadow-sm border-0 rounded-4 p-4 mb-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h6 class="text-muted mb-0">
            {{ page_obj.paginator.count }} Profiles Found
        </h6>

    </div>

    <div class="row g-3">

        <!-- Gender -->
        <div class="col-md-2">
            <label class="form-label small text-muted">Gender</label>
            <select name="gender" class="form-select">
                <option value="any" {% if selected_gender == "any" %}selected{% endif %}>Any</option>
                <option value="M" {% if selected_gender == "M" %}selected{% endif %}>Male</option>
                <option value="F" {% if selected_gender == "F" %}selected{% endif %}>Female</option>
            </select>
        </div>

        <!-- Min Age -->
        <div class="col-md-2">
            <label class="form-label small text-muted">Min Age</label>
            <input type="number"
                   name="min_age"
                   min="18"
                   class="form-control"
                   value="{{ request.GET.min_age }}">
        </div>

        <!-- Max Age -->
        <div class="col-md-2">
            <label class="form-label small text-muted">Max Age</label>
            <input type="number"
                   name="max_age"
                   min="18"
                   class="form-control"
                   value="{{ request.GET.max_age }}">
        </div>

        <!-- Min Height -->
        <div class="col-md-2">
            <label class="form-label small text-muted">Min Height</label>
            <input type="number"
                   name="min_height"
                   min="1"
                   class="form-control"
                   value="{{ request.GET.min_height }}">
        </div>

        <!-- Max Height -->
        <div class="col-md-2">
            <label class="form-label small text-muted">Max Height</label>
            <input type="number"
                   name="max_height"
                   min="1"
                   class="form-control"
                   value="{{ request.GET.max_height }}">
        </div>

        <!-- City -->
        <div class="col-md-2">
            <label class="form-label small text-muted">City</label>
            <select name="city" class="form-select">
                <option value="">Any</option>
                {% for city in cities %}
                    <option value="{{ city.id }}"
                        {% if request.GET.city == city.id|stringformat:"s" %}
                            selected
                        {% endif %}>
                        {{ city.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Caste -->
        <div class="col-md-3">
            <label class="form-label small text-muted">Caste / Sub-Caste</label>
            <input type="text"
                   name="caste"
                   class="form-control"
                   placeholder="Any Caste or Sub-Caste"
                   value="{{ request.GET.caste }}"
                   list="caste-filter-suggestions">
            <datalist id="caste-filter-suggestions">
                <option value="Rajput">
                <option value="Brahmin">
                <option value="Bhumihar">
                <option value="Yadav">
                <option value="Kushwaha">
                <option value="Kurmi">
                <option value="Bania / Gupta">
                <option value="Kayastha">
                <option value="Paswan">
                <option value="Ravidas">
                <option value="Nishad / Mallah">
                <option value="Teli">
                <option value="Kanu / Halwai">
                <option value="Prajapati / Kumhar">
                <option value="Vishwakarma / Badhai">
                <option value="Nai / Thakur">
                <option value="Ansari">
                <option value="Syed">
                <option value="Sheikh">
                <option value="Pathan">
            </datalist>
        </div>

        <!-- Buttons -->
        <div class="col-md-3 d-flex align-items-end gap-2">

            <button type="submit"
                    class="btn btn-dark w-100 rounded-pill">
                Apply
            </button>

            <a href="{% url 'profile_list' %}"
               hx-get="{% url 'profile_list' %}"
               hx-target="#profiles-grid-container"
               hx-indicator="#filter-indicator"
               hx-push-url="true"
               class="btn btn-outline-secondary w-100 rounded-pill">
                Reset
            </a>

        </div>

    </div>

</form>
</div>

<!-- Skeleton Shimmer Loading Indicator for Filters & Pagination -->
<div id="filter-indicator" class="htmx-indicator mb-4">
    <div class="row g-4 w-100">
        <div class="col-lg-4 col-md-6">
            <div class="card border-0 rounded-4 p-4 shadow-sm text-center">
                <div class="skeleton-shimmer rounded-circle mx-auto mb-3" style="width: 70px; height: 70px;"></div>
                <div class="skeleton-shimmer mx-auto mb-2" style="width: 60%; height: 20px;"></div>
                <div class="skeleton-shimmer mx-auto mb-3" style="width: 40%; height: 14px;"></div>
                <div class="skeleton-shimmer mx-auto" style="width: 100%; height: 32px; border-radius: 50rem;"></div>
            </div>
        </div>
        <div class="col-lg-4 col-md-6 d-none d-md-block">
            <div class="card border-0 rounded-4 p-4 shadow-sm text-center">
                <div class="skeleton-shimmer rounded-circle mx-auto mb-3" style="width: 70px; height: 70px;"></div>
                <div class="skeleton-shimmer mx-auto mb-2" style="width: 60%; height: 20px;"></div>
                <div class="skeleton-shimmer mx-auto mb-3" style="width: 40%; height: 14px;"></div>
                <div class="skeleton-shimmer mx-auto" style="width: 100%; height: 32px; border-radius: 50rem;"></div>
            </div>
        </div>
        <div class="col-lg-4 d-none d-lg-block">
            <div class="card border-0 rounded-4 p-4 shadow-sm text-center">
                <div class="skeleton-shimmer rounded-circle mx-auto mb-3" style="width: 70px; height: 70px;"></div>
                <div class="skeleton-shimmer mx-auto mb-2" style="width: 60%; height: 20px;"></div>
                <div class="skeleton-shimmer mx-auto mb-3" style="width: 40%; height: 14px;"></div>
                <div class="skeleton-shimmer mx-auto" style="width: 100%; height: 32px; border-radius: 50rem;"></div>
            </div>
        </div>
    </div>
</div>

<div id="profiles-grid-container">
    {% include 'users/includes/profile_grid.html' %}
</div>
</div>
{% endblock %}
