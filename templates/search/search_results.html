{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="py-4">
    <!-- Search Bar Section -->
    <div class="text-center mb-5">
        <h2 class="fw-bold logo-font">Search Community Profiles</h2>
        <p class="text-muted small">Find compatible matches by name, profession, city, or caste community.</p>

        <div class="row justify-content-center mt-4">
            <div class="col-lg-7 col-md-9">
                <form method="GET"
                      action="{% url 'search_profiles' %}"
                      hx-get="{% url 'search_profiles' %}"
                      hx-target="#search-results-container"
                      hx-indicator="#search-loading-indicator"
                      hx-push-url="true"
                      class="card shadow-sm border-0 rounded-pill p-2 bg-white">
                    <div class="input-group">
                        <input type="text"
                               name="q"
                               class="form-control border-0 bg-transparent ps-4"
                               placeholder="Search by name, occupation, city, or caste..."
                               value="{{ query }}"
                               hx-get="{% url 'search_profiles' %}"
                               hx-trigger="input changed delay:300ms, search"
                               hx-target="#search-results-container"
                               hx-indicator="#search-loading-indicator"
                               hx-push-url="true"
                               autocomplete="off">
                        <button class="btn btn-danger rounded-pill px-4 fw-semibold" type="submit">
                            Search
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Skeleton Loading Shimmer Indicator -->
    <div id="search-loading-indicator" class="htmx-indicator mb-4">
        <div class="row g-4 w-100">
            <div class="col-lg-4 col-md-6">
                <div class="card border-0 rounded-4 p-4 shadow-sm text-center">
                    <div class="skeleton-shimmer rounded-circle mx-auto mb-3" style="width: 100px; height: 100px;"></div>
                    <div class="skeleton-shimmer mx-auto mb-2" style="width: 60%; height: 20px;"></div>
                    <div class="skeleton-shimmer mx-auto mb-3" style="width: 40%; height: 14px;"></div>
                    <div class="skeleton-shimmer mx-auto mb-3" style="width: 80%; height: 24px; border-radius: 50rem;"></div>
                    <div class="skeleton-shimmer mx-auto" style="width: 100%; height: 36px; border-radius: 50rem;"></div>
                </div>
            </div>
            <div class="col-lg-4 col-md-6 d-none d-md-block">
                <div class="card border-0 rounded-4 p-4 shadow-sm text-center">
                    <div class="skeleton-shimmer rounded-circle mx-auto mb-3" style="width: 100px; height: 100px;"></div>
                    <div class="skeleton-shimmer mx-auto mb-2" style="width: 60%; height: 20px;"></div>
                    <div class="skeleton-shimmer mx-auto mb-3" style="width: 40%; height: 14px;"></div>
                    <div class="skeleton-shimmer mx-auto mb-3" style="width: 80%; height: 24px; border-radius: 50rem;"></div>
                    <div class="skeleton-shimmer mx-auto" style="width: 100%; height: 36px; border-radius: 50rem;"></div>
                </div>
            </div>
            <div class="col-lg-4 d-none d-lg-block">
                <div class="card border-0 rounded-4 p-4 shadow-sm text-center">
                    <div class="skeleton-shimmer rounded-circle mx-auto mb-3" style="width: 100px; height: 100px;"></div>
                    <div class="skeleton-shimmer mx-auto mb-2" style="width: 60%; height: 20px;"></div>
                    <div class="skeleton-shimmer mx-auto mb-3" style="width: 40%; height: 14px;"></div>
                    <div class="skeleton-shimmer mx-auto mb-3" style="width: 80%; height: 24px; border-radius: 50rem;"></div>
                    <div class="skeleton-shimmer mx-auto" style="width: 100%; height: 36px; border-radius: 50rem;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Live Search Results Container -->
    <div id="search-results-container">
        {% include 'search/includes/results_list.html' %}
    </div>
</div>
{% endblock %}
