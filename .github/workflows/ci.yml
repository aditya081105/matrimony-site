name: Django CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Tests & Static Checks
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: 'ci-secret-key-for-running-tests-safely-with-more-than-fifty-characters-randomized'
      DEBUG: 'True'
      CI: 'true'
      DATABASE_URL: 'postgresql://postgres:postgrespassword@localhost:5432/test_matrimony'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_matrimony
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Security Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r requirements.txt

      - name: Django System Checks
        run: |
          python manage.py check

      - name: Django Deployment Security Checks
        run: |
          python manage.py check --deploy

      - name: Validate Static Files
        run: |
          python manage.py collectstatic --noinput

      - name: Run Automated Test Suite
        run: |
          python manage.py test --verbosity=2
